{{- with site.Params.homeInfoParams }}
<article class="first-entry home-info home-hero">
  <div class="home-hero-inner">
    <div class="home-hero-copy">
      <header class="entry-header">
        <h1>{{ .Title | markdownify }}</h1>
      </header>
      <div class="entry-content">{{ .Content | markdownify }}</div>
      <div class="home-hero-contact" aria-label="Contact links">
        <a href="mailto:vtl2110t@columbia.edu">Email</a>
        <a
          href="https://www.linkedin.com/in/vassilylombard/"
          target="_blank"
          rel="noopener noreferrer"
          >LinkedIn</a
        >
      </div>
    </div>
    <div class="home-hero-image">
      <img src="/images/maphoto2.jpeg" alt="Profile" class="profile-img" />
    </div>
  </div>
</article>
{{- end -}}
